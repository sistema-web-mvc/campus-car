<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Caronas</title>
</head>
<body>
    <main>
        <h1>Carona disponíveis</h1>

        <p class="vazio" th:if="${#lists.isEmpty(caronas)}">
            Nenhuma carona encontrada.
        </p>

        <table th:unless="${#lists.isEmpty(caronas)}">
            <thead>
                <tr>
                    <th>Origem</th>
                    <th>Destino</th>
                    <th>Disponibilidade</th>
                    <th>Motorista</th>
                    <th>Vagas disponíveis</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="carona : ${caronas}">
                    <td th:text="${carona.origem}">Origem</td>
                    <td th:text="${carona.destino}">Destino</td>
                    <td th:text="${carona.disponibilidade}">Disponibilidade</td>
                    <td th:text="${carona.motorista.nome}">Motorista</td>
                    <td th:text="${carona.vagasDisponiveis}">0</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
