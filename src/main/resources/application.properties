spring.application.name=campuscar

# Configurações do Banco de Dados H2 em memória
spring.datasource.url=jdbc:h2:mem:campuscar
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console do H2 no navegador (acesso em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Força o Spring a sempre rodar o schema.sql e o data.sql
spring.sql.init.mode=always